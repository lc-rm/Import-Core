<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ログイン - Import Core</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <img src="assets/koala-think.png" alt="" class="auth-koala" />
    <h1>ログイン</h1>
    <p class="auth-sub">Import Core にサインインしてください</p>

    <form id="loginForm">
      <div class="form-row">
        <label for="userId">ユーザーID</label>
        <input type="text" id="userId" autocomplete="username" required autofocus />
      </div>
      <div class="form-row">
        <label for="password">パスワード</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="submit">ログイン</button>
    </form>
    <div id="msg" class="auth-msg muted"></div>
  </div>
</div>

<script src="auth.js"></script>
<script>
const $ = id => document.getElementById(id);

// ユーザー未登録なら初回セットアップへ
if (Auth.loadUsers().length === 0){
  location.href = 'setup.html';
}
// 既にログイン済みなら本画面へ
if (Auth.isLoggedIn()){
  location.href = 'index.html';
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const userId = $('userId').value.trim();
  const pw = $('password').value;
  const msg = $('msg');

  msg.textContent = '認証中...';
  try {
    const ok = await Auth.verify(userId, pw);
    if (!ok){
      msg.innerHTML = '<span class="err">ID または パスワードが違います</span>';
      return;
    }
    Auth.setSession(userId, pw);
    msg.innerHTML = '<span class="ok">ログイン成功</span>';
    setTimeout(() => location.href = 'index.html', 300);
  } catch(err){
    msg.innerHTML = `<span class="err">${err.message}</span>`;
  }
});
</script>
</body>
</html>
