<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ログイン - Import Core</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <img src="assets/koala-wave.png" alt="" class="auth-koala" />
    <h1>Import Core</h1>
    <p class="auth-sub">採用コア取込ツール</p>

    <div class="form-row">
      <label for="loginId">ID</label>
      <input type="text" id="loginId" placeholder="ID を入力" autocomplete="username">
    </div>

    <div class="form-row">
      <label for="loginPw">パスワード</label>
      <input type="password" id="loginPw" autocomplete="current-password">
    </div>

    <button type="button" id="loginBtn" class="submit" onclick="doLogin()">ログイン</button>

    <div id="status" class="auth-msg"></div>
  </div>
</div>

<script src="github-store.js"></script>
<script>
  const SHARED_LOGIN_ID = 'client-saiyou@link-core.co.jp';
  const SHARED_LOGIN_PW = 'linkcore2291-26';

  async function doLogin() {
    const id = document.getElementById('loginId').value.trim();
    const pw = document.getElementById('loginPw').value;
    const btn = document.getElementById('loginBtn');

    if (!id || !pw) {
      showStatus('err', 'ID とパスワードを両方入力してください');
      return;
    }

    if (id !== SHARED_LOGIN_ID || pw !== SHARED_LOGIN_PW) {
      showStatus('err', 'ID またはパスワードが違います');
      return;
    }

    const token = localStorage.getItem('importcore.github.pat');
    if (!token) {
      showStatus('warn',
        'この PC は初期設定が済んでいません。<br>' +
        '管理者から送られた「初期設定リンク」をクリックしてください。'
      );
      return;
    }

    btn.disabled = true;
    btn.textContent = '認証中...';
    showStatus('muted', 'データに接続しています...');

    try {
      await GitHubStore.authenticate(token);

      const operatorEmail = localStorage.getItem('importcore.operator.email');
      if (operatorEmail) {
        const users = await GitHubStore.loadUserList();
        const exists = users.find(u => u.email === operatorEmail);
        if (exists) {
          showStatus('ok', `${exists.displayName} としてログイン中...`);
          setTimeout(() => { window.location.href = 'index.html'; }, 400);
          return;
        }
        localStorage.removeItem('importcore.operator.email');
      }

      showStatus('ok', '認証成功!担当者選択画面へ移動します...');
      setTimeout(() => { window.location.href = 'operator-select.html'; }, 400);

    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'ログイン';

      let msg = e.message || 'エラーが発生しました';
      if (msg.includes('UNAUTHORIZED')) {
        msg = 'この PC のログインキーが期限切れまたは無効です。管理者に新しい初期設定リンクを依頼してください。';
      } else if (msg.includes('FORBIDDEN')) {
        msg = '権限エラーです。管理者にご確認ください。';
      } else if (msg.includes('NOT_FOUND')) {
        msg = 'データに接続できません。管理者にご確認ください。';
      } else if (/NetworkError|Failed to fetch/.test(msg)) {
        msg = 'ネットワークエラー。インターネット接続を確認してください。';
      }
      showStatus('err', msg);
    }
  }

  function showStatus(type, msg) {
    const el = document.getElementById('status');
    el.className = 'auth-msg ' + type;
    el.innerHTML = msg;
  }

  window.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('importcore.github.pat');
    const operator = localStorage.getItem('importcore.operator.email');
    const stayLogin = sessionStorage.getItem('importcore.force.login');

    if (stayLogin) {
      sessionStorage.removeItem('importcore.force.login');
      document.getElementById('loginId').focus();
      return;
    }

    if (token && operator) {
      window.location.href = 'index.html';
      return;
    }

    document.getElementById('loginId').focus();
  });

  document.getElementById('loginPw').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('loginId').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('loginPw').focus();
  });
</script>
</body>
</html>
