<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Import Core - ログイン</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .google-btn-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      width: 100%;
    }
    button.google-btn {
      background: #fff;
      color: #3c4043;
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid #dadce0;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      width: 100%;
      max-width: 320px;
      height: auto;
      line-height: 1;
      box-shadow: none;
      text-shadow: none;
    }
    button.google-btn:hover {
      background: #f8f9fa;
      color: #3c4043;
      border-color: #c0c4c9;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    button.google-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.google-btn img {
      width: 18px;
      height: 18px;
      max-width: 18px;
      max-height: 18px;
      flex-shrink: 0;
      display: inline-block;
    }
    .hint {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 16px;
    }
    .ic-loading {
      color: #059669;
      font-size: 13px;
      margin-top: 12px;
      display: none;
      text-align: center;
    }
    .ic-loading.show { display: block; }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <img src="assets/koala-wave.png" alt="" class="auth-koala" />
    <h1>Import Core</h1>
    <p class="auth-sub">採用コア取込ツール<br>Googleアカウントでログインしてください</p>

    <div class="google-btn-wrap" style="display:flex !important;justify-content:center !important;align-items:center !important;width:100% !important;text-align:center !important;margin-top:20px !important;">
      <button class="google-btn" id="btnLogin" style="background:#fff !important;color:#3c4043 !important;padding:14px 32px !important;border-radius:12px !important;font-weight:500 !important;font-size:14px !important;display:inline-flex !important;align-items:center !important;justify-content:center !important;gap:12px !important;border:1px solid #dadce0 !important;cursor:pointer !important;width:100% !important;max-width:320px !important;height:auto !important;line-height:1 !important;box-shadow:none !important;transition:all 0.15s ease !important;">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" style="width:18px !important;height:18px !important;max-width:18px !important;max-height:18px !important;flex-shrink:0;display:inline-block !important;" />
        <span style="color:#3c4043 !important;">Googleでログイン</span>
      </button>
    </div>

    <div class="ic-loading" id="loading" style="display:none;">確認中...</div>
    <div id="errorMsg" class="auth-msg err" style="display:none; margin-top:12px;"></div>

    <p class="hint">@link-core.co.jp のアカウントのみアクセス可能です</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyABGLA8_0qREKGRbbe0XYja914Ojnd18ZA",
  authDomain: "import-core.firebaseapp.com",
  projectId: "import-core",
  storageBucket: "import-core.firebasestorage.app",
  messagingSenderId: "449866396771",
  appId: "1:449866396771:web:b342a84f66ec8307903456"
};

const ALLOWED_DOMAIN = "link-core.co.jp";
const REDIRECT_AFTER_LOGIN = "./index.html";
const SETUP_PAGE = "./setup.html";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
// Google アカウント選択時、@link-core.co.jp のヒントを出す
provider.setCustomParameters({ hd: ALLOWED_DOMAIN });

// セッション持続(ブラウザ閉じても保持)
await setPersistence(auth, browserLocalPersistence);

const errorEl = document.getElementById('errorMsg');
const loadingEl = document.getElementById('loading');
const btnLogin = document.getElementById('btnLogin');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
  loadingEl.style.display = 'none';
  btnLogin.disabled = false;
}
function clearError() {
  errorEl.style.display = 'none';
}

// 既にログイン済みなら、自動でリダイレクト先へ
onAuthStateChanged(auth, (user) => {
  if (user) {
    const email = user.email || '';
    if (email.endsWith('@' + ALLOWED_DOMAIN)) {
      loadingEl.textContent = 'ログイン済みです。リダイレクトします...';
      loadingEl.style.display = 'block';
      // 共通PAT(難読化埋め込み)を localStorage にセット
      try {
        const _p1 = "Z2l0aHViX3BhdF8xMUNETU1ZSEEwWFJCaEVhS0tnNmFxX0VjRWkwdEU3Y0QyRl";
        const _p2 = "h6UE1JQUVKaXlZOVh6RVlQVzVVZHZKeUJ0RFU1SzY2REtBSE5CNEFrUTlKQmNF";
        localStorage.setItem('importcore.github.pat', atob(_p1 + _p2));
      } catch (e) { /* ignore */ }
      // 担当者メアドも保存(github-store.js が参照する)
      localStorage.setItem('importcore.operator.email', email);
      // 必ず index.html へ(共通PATがあるのでsetup.htmlは不要)
      setTimeout(() => {
        window.location.href = REDIRECT_AFTER_LOGIN;
      }, 500);
    } else {
      signOut(auth);
      showError('@' + ALLOWED_DOMAIN + ' のアカウントでログインしてください');
    }
  }
});

btnLogin.onclick = async () => {
  clearError();
  loadingEl.textContent = '確認中...';
  loadingEl.style.display = 'block';
  btnLogin.disabled = true;
  try {
    const result = await signInWithPopup(auth, provider);
    const email = result.user.email || '';
    if (!email.endsWith('@' + ALLOWED_DOMAIN)) {
      await signOut(auth);
      showError('@' + ALLOWED_DOMAIN + ' のアカウントでログインしてください');
      return;
    }
    // 成功時は onAuthStateChanged が発火してリダイレクトされる
  } catch (err) {
    console.error(err);
    if (err.code === 'auth/popup-closed-by-user') {
      loadingEl.style.display = 'none';
      btnLogin.disabled = false;
      return;
    }
    showError('ログインに失敗しました: ' + (err.message || err));
  }
};
</script>
</body>
</html>
