<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Import Core - ログイン</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .google-btn {
    .google-btn-wrap {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }
    .google-btn {
      background: #fff;
      color: #1F2937;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 2px solid var(--mint-200, #a7f3d0);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .google-btn:hover {
      transform: scale(1.02);
      border-color: var(--mint-500, #10b981);
    }
    .google-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .google-btn img {
      width: 18px;
      height: 18px;
    }
    .hint {
      font-size: 11px;
      color: var(--gray-400, #9ca3af);
      margin-top: 16px;
    }
    .loading {
      color: var(--mint-600, #059669);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .loading.show { display: block; }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <img src="assets/koala-wave.png" alt="" class="auth-koala" />
    <h1>Import Core</h1>
    <p class="auth-sub">採用コア取込ツール<br>Googleアカウントでログインしてください</p>

    <div class="google-btn-wrap">
      <button class="google-btn" id="btnLogin">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" />
        Googleでログイン
      </button>
    </div>

    <div class="loading" id="loading">確認中...</div>
    <div id="errorMsg" class="auth-msg err" style="display:none; margin-top:12px;"></div>

    <p class="hint">@link-core.co.jp のアカウントのみアクセス可能です</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyABGLA8_0qREKGRbbe0XYja9140jnd18ZA",
  authDomain: "import-core.firebaseapp.com",
  projectId: "import-core",
  storageBucket: "import-core.firebasestorage.app",
  messagingSenderId: "449866396771",
  appId: "1:449866396771:web:b342a84f66ec8307903456"
};

const ALLOWED_DOMAIN = "link-core.co.jp";
const REDIRECT_AFTER_LOGIN = "./index.html";
const SETUP_PAGE = "./setup.html";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
// Google アカウント選択時、@link-core.co.jp のヒントを出す
provider.setCustomParameters({ hd: ALLOWED_DOMAIN });

// セッション持続(ブラウザ閉じても保持)
await setPersistence(auth, browserLocalPersistence);

const errorEl = document.getElementById('errorMsg');
const loadingEl = document.getElementById('loading');
const btnLogin = document.getElementById('btnLogin');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
  loadingEl.classList.remove('show');
  btnLogin.disabled = false;
}
function clearError() {
  errorEl.style.display = 'none';
}

// 既にログイン済みなら、自動でリダイレクト先へ
onAuthStateChanged(auth, (user) => {
  if (user) {
    const email = user.email || '';
    if (email.endsWith('@' + ALLOWED_DOMAIN)) {
      loadingEl.textContent = 'ログイン済みです。リダイレクトします...';
      loadingEl.classList.add('show');
      // PATがあるかで遷移先を分ける
      const pat = localStorage.getItem('importcore.github.pat');
      const dest = pat ? REDIRECT_AFTER_LOGIN : SETUP_PAGE;
      // 担当者メアドも保存(github-store.js が参照する)
      localStorage.setItem('importcore.operator.email', email);
      setTimeout(() => {
        window.location.href = dest;
      }, 500);
    } else {
      signOut(auth);
      showError('@' + ALLOWED_DOMAIN + ' のアカウントでログインしてください');
    }
  }
});

btnLogin.onclick = async () => {
  clearError();
  loadingEl.textContent = '確認中...';
  loadingEl.classList.add('show');
  btnLogin.disabled = true;
  try {
    const result = await signInWithPopup(auth, provider);
    const email = result.user.email || '';
    if (!email.endsWith('@' + ALLOWED_DOMAIN)) {
      await signOut(auth);
      showError('@' + ALLOWED_DOMAIN + ' のアカウントでログインしてください');
      return;
    }
    // 成功時は onAuthStateChanged が発火してリダイレクトされる
  } catch (err) {
    console.error(err);
    if (err.code === 'auth/popup-closed-by-user') {
      loadingEl.classList.remove('show');
      btnLogin.disabled = false;
      return;
    }
    showError('ログインに失敗しました: ' + (err.message || err));
  }
};
</script>
</body>
</html>
