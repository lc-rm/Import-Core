<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>アカウント - Import Core</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="brand">
    <img src="assets/koala-pc.png" alt="" />
    <span>Import Core</span>
  </div>
  <nav>
    <a href="index.html">変換</a>
    <a href="settings.html">クライアント・履歴</a>
    <a href="account.html" class="active">アカウント</a>
  </nav>
  <div class="user-badge">
    <span>👤 <span class="uid" id="currentUser"></span></span>
    <button id="logoutBtn" type="button">ログアウト</button>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-header-with-koala">
      <img src="assets/koala-think.png" alt="" />
      <div>
        <h1>パスワード変更</h1>
        <div class="note">現在ログインしているアカウント(<b id="meId"></b>)のパスワードを変更します。</div>
      </div>
    </div>

    <div class="row">
      <label>現在のパスワード<input type="password" id="oldPw" /></label>
      <label>新しいパスワード<input type="password" id="newPw" placeholder="6文字以上" /></label>
      <label>新しいパスワード(確認)<input type="password" id="newPw2" /></label>
    </div>
    <button id="changePwBtn">パスワードを変更</button>
    <span id="pwMsg" class="muted" style="margin-left:12px"></span>
  </div>

  <div class="card">
    <h2>ユーザー管理</h2>
    <div class="note">ツールを利用するユーザーを追加・削除できます。各ユーザーは独立したパスワードでログインします。<br>
    <b style="color: var(--orange-500)">⚠️ 重要</b>:暗号化されたデータ(クライアント・履歴)は<b>現在ログイン中のパスワードと紐づいています</b>。新規ユーザーは別アカウントとして扱われ、独自のデータ領域を持ちます(共有はされません)。チームで同じデータを共有する場合は、同じユーザーIDで複数人がログインしてください。</div>

    <h3 class="section-h3">新規ユーザーを追加</h3>
    <div class="row">
      <label>ユーザーID<input type="text" id="newUserId" placeholder="メールアドレス または 任意のID(3文字以上)" /></label>
      <label>パスワード<input type="password" id="newUserPw" placeholder="6文字以上" /></label>
    </div>
    <button id="addUserBtn">ユーザーを追加</button>
    <span id="userMsg" class="muted" style="margin-left:12px"></span>

    <h3 class="section-h3" style="margin-top:24px">登録済みユーザー</h3>
    <div id="userList"></div>
  </div>
</main>

<script src="auth.js"></script>
<script>
const $ = id => document.getElementById(id);
if (!Auth.requireLogin()) throw new Error('login required');

function init(){
  const meId = Auth.getCurrentUserId();
  $('currentUser').textContent = meId;
  $('meId').textContent = meId;
  $('logoutBtn').onclick = () => { Auth.clearSession(); location.href = 'login.html'; };

  renderUsers();

  $('changePwBtn').onclick = onChangePw;
  $('addUserBtn').onclick = onAddUser;
}

async function onChangePw(){
  const oldPw = $('oldPw').value;
  const newPw = $('newPw').value;
  const newPw2 = $('newPw2').value;
  const msg = $('pwMsg');

  if (!oldPw || !newPw){ msg.innerHTML = '<span class="err">未入力の項目があります</span>'; return; }
  if (newPw !== newPw2){ msg.innerHTML = '<span class="err">新しいパスワードが一致しません</span>'; return; }
  if (newPw.length < 6){ msg.innerHTML = '<span class="err">6文字以上にしてください</span>'; return; }

  try {
    await Auth.changePassword(Auth.getCurrentUserId(), oldPw, newPw);
    // セッションも新PWに更新
    Auth.setSession(Auth.getCurrentUserId(), newPw);
    SecureStore.invalidate();
    msg.innerHTML = '<span class="ok">パスワードを変更しました</span>';
    $('oldPw').value = $('newPw').value = $('newPw2').value = '';
  } catch(e){
    msg.innerHTML = `<span class="err">${e.message}</span>`;
  }
}

async function onAddUser(){
  const userId = $('newUserId').value.trim();
  const pw = $('newUserPw').value;
  const msg = $('userMsg');

  if (!Auth.isAdmin(Auth.getCurrentUserId())){
    msg.innerHTML = '<span class="err">ユーザー追加は管理者のみ実行できます</span>';
    return;
  }
  if (!/^[A-Za-z0-9_.@\-]{3,}$/.test(userId)){
    msg.innerHTML = '<span class="err">IDは半角英数字、_ - . @ のみ、3文字以上で入力してください</span>';
    return;
  }
  if (pw.length < 6){
    msg.innerHTML = '<span class="err">パスワードは6文字以上にしてください</span>';
    return;
  }

  try {
    await Auth.addUser(userId, pw, 'user');
    $('newUserId').value = '';
    $('newUserPw').value = '';
    msg.innerHTML = '<span class="ok">ユーザーを追加しました</span>';
    renderUsers();
  } catch(e){
    msg.innerHTML = `<span class="err">${e.message}</span>`;
  }
}

function renderUsers(){
  const users = Auth.loadUsers();
  const meId = Auth.getCurrentUserId();
  const meIsAdmin = Auth.isAdmin(meId);
  const box = $('userList');

  // 管理者でない場合は新規追加フォームを無効化
  $('newUserId').disabled = !meIsAdmin;
  $('newUserPw').disabled = !meIsAdmin;
  $('addUserBtn').disabled = !meIsAdmin;
  if (!meIsAdmin){
    $('userMsg').innerHTML = '<span class="muted">※ ユーザー管理は管理者のみ実行できます</span>';
  }

  if (users.length === 0){
    box.innerHTML = '<p class="muted">ユーザーがいません</p>';
    return;
  }
  const head = `<tr>
    <th>ユーザーID</th>
    <th>作成日</th>
    <th>権限</th>
    ${meIsAdmin ? '<th>操作</th>' : ''}
  </tr>`;
  const body = users.map(u => {
    const isMe = u.userId === meId;
    const isSuper = Auth.isSuperAdmin(u.userId);
    const role = Auth.getRole(u.userId);
    const created = u.createdAt ? new Date(u.createdAt).toLocaleString('ja-JP') : '-';

    let badges = '';
    if (isMe) badges += ' <span class="badge">あなた</span>';

    let roleLabel = '';
    if (isSuper){
      roleLabel = '<span class="role-super">🛡️ 絶対管理者</span>';
    } else if (role === 'admin'){
      roleLabel = '<span class="role-admin">🛡️ 管理者</span>';
    } else {
      roleLabel = '<span class="role-user">一般</span>';
    }

    let actions = '';
    if (meIsAdmin){
      const buttons = [];
      if (isSuper){
        buttons.push('<span class="muted">(操作不可)</span>');
      } else {
        if (role === 'admin'){
          buttons.push(`<button class="small" data-id="${escapeHtml(u.userId)}" data-action="demote">管理者解除</button>`);
        } else {
          buttons.push(`<button class="small" data-id="${escapeHtml(u.userId)}" data-action="promote">管理者にする</button>`);
        }
        if (isMe){
          buttons.push('<span class="muted">(自分は削除できません)</span>');
        } else {
          buttons.push(`<button class="small danger" data-id="${escapeHtml(u.userId)}" data-action="delete">削除</button>`);
        }
      }
      actions = `<td>${buttons.join(' ')}</td>`;
    }

    return `
      <tr>
        <td>${escapeHtml(u.userId)}${badges}</td>
        <td>${created}</td>
        <td>${roleLabel}</td>
        ${actions}
      </tr>`;
  }).join('');
  box.innerHTML = `<div class="scroll"><table>${head}${body}</table></div>`;

  box.querySelectorAll('button[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', async e => {
      const uid = e.target.dataset.id;
      if (!confirm(`ユーザー「${uid}」を削除します。よろしいですか?`)) return;
      try {
        await Auth.deleteUser(uid);
        renderUsers();
      } catch(err){
        alert(err.message);
      }
    });
  });
  box.querySelectorAll('button[data-action="promote"]').forEach(btn => {
    btn.addEventListener('click', async e => {
      const uid = e.target.dataset.id;
      if (!confirm(`「${uid}」を管理者にします。\n管理者はユーザーの追加・削除・権限変更ができるようになります。よろしいですか?`)) return;
      try {
        await Auth.setRole(uid, 'admin');
        renderUsers();
      } catch(err){
        alert(err.message);
      }
    });
  });
  box.querySelectorAll('button[data-action="demote"]').forEach(btn => {
    btn.addEventListener('click', async e => {
      const uid = e.target.dataset.id;
      if (!confirm(`「${uid}」の管理者権限を解除します。よろしいですか?`)) return;
      try {
        await Auth.setRole(uid, 'user');
        renderUsers();
      } catch(err){
        alert(err.message);
      }
    });
  });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

init();
</script>
</body>
</html>
