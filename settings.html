<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>クライアント・履歴 - Import Core</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="brand">
    <img src="assets/koala-pc.png" alt="" />
    <span>Import Core</span>
  </div>
  <nav>
    <a href="index.html">変換</a>
    <a href="settings.html" class="active">クライアント・履歴</a>
    <a href="admin.html" id="navAdmin" style="display:none;">設定</a>
  </nav>
  <div class="user-badge">
    <span>👤 <span class="uid" id="currentUser"></span></span>
    <button id="logoutBtn" type="button">ログアウト</button>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-header-with-koala">
      <img src="assets/koala-happy.png" alt="" />
      <div>
        <h1>クライアント管理</h1>
        <div class="note">変換ツールで使用するクライアントを追加・編集・削除できます。</div>
      </div>
    </div>

    <h3 class="section-h3">新規追加</h3>
    <div class="row">
      <label class="big-label" style="flex:1; max-width:600px">クライアント名<input id="newName" class="big-input" placeholder="例:株式会社Link Core" style="width:100%" /></label>
    </div>
    <div style="margin:-4px 0 12px 0; display:flex; gap:6px; flex-wrap:wrap; align-items:center">
      <span class="muted" style="font-size:12px; margin-right:4px">クイック入力:</span>
      <button type="button" class="quick-prefix" data-prefix="株式会社" style="padding:6px 14px; font-size:13px; background:#fff; color:var(--mint-700); border:1px solid var(--mint-400); border-radius:18px; cursor:pointer; font-weight:500">+ 株式会社</button>
      <button type="button" class="quick-prefix" data-prefix="有限会社" style="padding:6px 14px; font-size:13px; background:#fff; color:var(--mint-700); border:1px solid var(--mint-400); border-radius:18px; cursor:pointer; font-weight:500">+ 有限会社</button>
      <button type="button" class="quick-prefix" data-prefix="合同会社" style="padding:6px 14px; font-size:13px; background:#fff; color:var(--mint-700); border:1px solid var(--mint-400); border-radius:18px; cursor:pointer; font-weight:500">+ 合同会社</button>
    </div>
    <button id="addBtn">クライアントを追加</button>
    <span id="addMsg" class="muted" style="margin-left:12px"></span>

    <h3 class="section-h3" style="margin-top:24px">登録済みクライアント</h3>
    <div id="clientList"></div>
  </div>

  <div class="card">
    <h2>取込履歴管理</h2>
    <div class="note">全クライアント横断で<b>直近5件</b>の取込履歴を表示します。誤って取り込んだ場合は「削除」で1件単位で消せます。<br>
    クライアントごとの全履歴(各媒体最大5件)は<a href="index.html">変換ページ</a>で確認できます。</div>
    <div id="historyAll"></div>
  </div>
</main>

<script src="github-store.js"></script>
<script src="sources.js"></script>
<script>
const $ = id => document.getElementById(id);
if (!Auth.requireLogin()) throw new Error('login required');

async function init(){
  $('currentUser').textContent = Auth.getCurrentUserId();
  $('logoutBtn').onclick = () => { Auth.clearSession(); location.href = 'login.html'; };

  // 管理者なら「設定」タブを表示
  await GitHubStore.loadUsers();
  const opEmail = GitHubStore.getOperatorEmail();
  if (GitHubStore.canManageUsers(opEmail)) {
    $('navAdmin').style.display = '';
  }

  await renderClients();
  await renderHistoryAll();

  $('addBtn').onclick = onAdd;

  // クイック入力ボタン
  document.querySelectorAll('.quick-prefix').forEach(btn => {
    btn.addEventListener('click', () => insertPrefix(btn.dataset.prefix));
  });
}

function insertPrefix(prefix){
  const inp = $('newName');
  const v = inp.value;
  if (!v){
    inp.value = prefix;
    inp.focus();
    inp.setSelectionRange(prefix.length, prefix.length);
  } else {
    const start = inp.selectionStart ?? v.length;
    const end = inp.selectionEnd ?? v.length;
    inp.value = v.slice(0, start) + prefix + v.slice(end);
    inp.focus();
    const newPos = start + prefix.length;
    inp.setSelectionRange(newPos, newPos);
  }
}

async function onAdd(){
  const name = $('newName').value.trim();
  if (!name){ $('addMsg').innerHTML = '<span class="err">名前を入力してください</span>'; return; }
  const clients = await SecureStore.loadClients();
  if (clients.some(c => c.name === name)){
    $('addMsg').innerHTML = '<span class="err">同じ名前のクライアントが既に存在します</span>';
    return;
  }

  const btn = $('addBtn');
  btn.disabled = true;
  btn.textContent = '追加中...';
  $('addMsg').innerHTML = '<span class="muted">追加中...</span>';

  try {
    await SecureStore.addClient({ name });
    $('newName').value = '';
    $('addMsg').innerHTML = '<span class="ok">追加しました</span>';
    setTimeout(() => $('addMsg').innerHTML = '', 1500);
    await renderClients();
    await renderHistoryAll();
  } catch (err) {
    $('addMsg').innerHTML = `<span class="err">追加に失敗しました: ${err.message || err}</span>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'クライアントを追加';
  }
}

async function renderClients(){
  const list = await SecureStore.loadClients();
  const box = $('clientList');
  if (list.length === 0){
    box.innerHTML = `
      <div class="hero-empty">
        <img src="assets/koala-think.png" alt="" />
        <p>まだクライアントが登録されていません</p>
      </div>`;
    return;
  }
  const head = `<tr><th>名前</th><th>操作</th></tr>`;
  const body = list.map(c => `
    <tr data-id="${c.id}" data-name="${escapeHtml(c.name)}">
      <td class="name-cell"><span class="name-view">${escapeHtml(c.name)}</span></td>
      <td>
        <button class="small" data-action="edit">変更</button>
        <button class="small danger" data-action="delete">削除</button>
      </td>
    </tr>
  `).join('');
  box.innerHTML = `<div class="scroll"><table class="editable">${head}${body}</table></div>`;
  box.querySelectorAll('button').forEach(btn => btn.addEventListener('click', onClientAction));
}

function enterEditMode(tr){
  const name = tr.dataset.name;
  tr.querySelector('.name-cell').innerHTML = `<input type="text" value="${escapeHtml(name)}" data-field="name" />`;
  tr.querySelector('td:last-child').innerHTML = `
    <button class="small" data-action="save">保存</button>
    <button class="small" data-action="cancel">キャンセル</button>
  `;
  tr.querySelectorAll('button').forEach(btn => btn.addEventListener('click', onClientAction));
  const inp = tr.querySelector('input');
  inp.focus();
  inp.select();
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); tr.querySelector('button[data-action="save"]').click(); }
    if (e.key === 'Escape'){ tr.querySelector('button[data-action="cancel"]').click(); }
  });
}

function exitEditMode(tr, newName){
  if (newName) tr.dataset.name = newName;
  const name = tr.dataset.name;
  tr.querySelector('.name-cell').innerHTML = `<span class="name-view">${escapeHtml(name)}</span>`;
  tr.querySelector('td:last-child').innerHTML = `
    <button class="small" data-action="edit">変更</button>
    <button class="small danger" data-action="delete">削除</button>
  `;
  tr.querySelectorAll('button').forEach(btn => btn.addEventListener('click', onClientAction));
}

async function onClientAction(e){
  const tr = e.target.closest('tr');
  const id = tr.dataset.id;
  const action = e.target.dataset.action;
  const btn = e.target;

  if (action === 'edit'){
    enterEditMode(tr);
  } else if (action === 'cancel'){
    exitEditMode(tr);
  } else if (action === 'save'){
    const inp = tr.querySelector('input[data-field="name"]');
    const newName = inp.value.trim();
    if (!newName){ alert('名前を空にはできません'); inp.focus(); return; }
    const clients = await SecureStore.loadClients();
    if (clients.some(c => c.id !== id && c.name === newName)){
      alert('同じ名前のクライアントが既に存在します');
      inp.focus(); inp.select();
      return;
    }
    btn.disabled = true;
    btn.textContent = '保存中...';
    try {
      await SecureStore.updateClient(id, { name: newName });
      exitEditMode(tr, newName);
      flash(tr.querySelector('button[data-action="edit"]'), '保存しました');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '保存';
      alert('保存に失敗しました: ' + (err.message || err));
    }
  } else if (action === 'delete'){
    const clients = await SecureStore.loadClients();
    const c = clients.find(x => x.id === id);
    if (!confirm(`「${c.name}」を削除します。\n\n関連する取込履歴もすべて削除されます。よろしいですか?`)) return;

    // 楽観的UI更新:行をフェードアウト
    tr.style.transition = 'opacity 0.2s';
    tr.style.opacity = '0.4';
    btn.disabled = true;
    btn.textContent = '削除中...';

    try {
      await SecureStore.deleteClient(id);
      tr.remove();
      // 全削除されたら空状態を表示するため再レンダリング
      const remaining = document.querySelectorAll('#clientList tr[data-id]').length;
      if (remaining === 0) await renderClients();
      await renderHistoryAll();
    } catch (err) {
      tr.style.opacity = '1';
      btn.disabled = false;
      btn.textContent = '削除';
      alert('削除に失敗しました: ' + (err.message || err));
    }
  }
}

async function renderHistoryAll(){
  const clients = await SecureStore.loadClients();
  const all = await SecureStore.getAllHistory();
  const box = $('historyAll');
  if (clients.length === 0){
    box.innerHTML = '<p class="muted">クライアントが未登録です</p>';
    return;
  }

  const clientName = {};
  for (const c of clients) clientName[c.id] = c.name;

  const flat = [];
  for (const cId in all){
    if (!clientName[cId]) continue;
    const byClient = all[cId] || {};
    for (const sId in byClient){
      const arr = byClient[sId] || [];
      for (const e of arr){
        flat.push({ cId, sId, ...e });
      }
    }
  }

  if (flat.length === 0){
    box.innerHTML = '<p class="muted">履歴がありません(変換ページで取込を行うと記録されます)</p>';
    return;
  }

  flat.sort((a, b) => new Date(b.processedAt) - new Date(a.processedAt));
  const top = flat.slice(0, 5);

  const rows = top.map((e, i) => {
    const dt = new Date(e.processedAt).toLocaleString('ja-JP');
    const cName = clientName[e.cId] || e.cId;
    const sLabel = (typeof SOURCES !== 'undefined' && SOURCES[e.sId] && SOURCES[e.sId].label) || e.sId;
    const total = e.totalCount ?? e.count ?? 0;
    const newC = e.newCount ?? e.count ?? 0;
    const dupC = e.dupCount ?? 0;
    const dlBtn = e.csv
      ? `<button class="small" data-client="${e.cId}" data-source="${e.sId}" data-processed="${e.processedAt}" data-action="download">📥CSV</button>`
      : `<span class="muted" style="font-size:11px">―</span>`;
    const delBtn = `<button class="small danger" data-client="${e.cId}" data-source="${e.sId}" data-processed="${e.processedAt}" data-action="delete">削除</button>`;
    return `<tr data-row-key="${e.cId}__${e.sId}__${e.processedAt}">
      <td>${i+1}</td>
      <td>${dt}</td>
      <td>${escapeHtml(cName)}</td>
      <td><b>${escapeHtml(sLabel)}</b></td>
      <td>${total}件</td>
      <td class="ok">${newC}件</td>
      <td class="dup">${dupC}件</td>
      <td>${dlBtn}</td>
      <td>${delBtn}</td>
    </tr>`;
  }).join('');

  const note = flat.length > 5
    ? `<div class="muted" style="margin-top:8px;font-size:12px">直近5件を表示中(全${flat.length}件)。クライアントごとの全履歴は<a href="index.html">変換ページ</a>で確認できます。</div>`
    : '';

  box.innerHTML = `
    <div class="scroll">
      <table>
        <thead>
          <tr><th>#</th><th>取込日時</th><th>クライアント</th><th>媒体</th><th>全体</th><th>新規</th><th>重複</th><th>CSV</th><th>操作</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${note}`;

  box.querySelectorAll('button[data-action="download"]').forEach(btn => {
    btn.addEventListener('click', async e => {
      const cId = e.target.dataset.client;
      const sId = e.target.dataset.source;
      const processed = e.target.dataset.processed;
      const all = await SecureStore.getAllHistory();
      const arr = (all[cId] && all[cId][sId]) || [];
      const entry = arr.find(x => x.processedAt === processed);
      if (!entry || !entry.csv){
        alert('このCSVデータは保持されていません(直近1回分のみ再ダウンロード可能です)');
        return;
      }
      const blob = new Blob([entry.csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = entry.filename || 'export.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });
  });

  box.querySelectorAll('button[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', async e => {
      const b = e.currentTarget;
      const cId = b.dataset.client;
      const sId = b.dataset.source;
      const processed = b.dataset.processed;
      const tr = b.closest('tr');
      const cName = clientName[cId] || cId;
      const sLabel = (typeof SOURCES !== 'undefined' && SOURCES[sId] && SOURCES[sId].label) || sId;
      const dt = new Date(processed).toLocaleString('ja-JP');
      const msg =
        `以下の履歴を削除します。よろしいですか?\n\n` +
        `クライアント: ${cName}\n` +
        `媒体: ${sLabel}\n` +
        `取込日時: ${dt}\n\n` +
        `※ 削除すると、この回に取り込んだ応募者の重複チェックが効かなくなります。`;
      if (!confirm(msg)) return;

      // 楽観的UI更新
      tr.style.transition = 'opacity 0.2s';
      tr.style.opacity = '0.4';
      b.disabled = true;
      b.textContent = '削除中...';

      try {
        await SecureStore.deleteHistoryEntry(cId, sId, processed);
        tr.remove();
        // 全削除されたら空状態を表示するため再レンダリング
        const remaining = document.querySelectorAll('#historyAll tr[data-row-key]').length;
        if (remaining === 0) await renderHistoryAll();
      } catch (err) {
        tr.style.opacity = '1';
        b.disabled = false;
        b.textContent = '削除';
        alert('削除に失敗しました: ' + (err.message || err));
      }
    });
  });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function flash(el, text){
  const old = el.textContent;
  el.textContent = text;
  setTimeout(() => { el.textContent = old; }, 1000);
}

init().catch(e => { console.error(e); alert('エラー: ' + e.message); });
</script>
</body>
</html>
