<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>担当者選択 - Import Core</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .op-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .op-card {
      background: #fff;
      border: 2px solid var(--mint-100);
      border-radius: 12px;
      padding: 16px 18px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .op-card:hover {
      border-color: var(--mint-400);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(29, 144, 128, 0.12);
    }
    .op-avatar-big {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mint-300), var(--mint-500));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .op-info {
      flex: 1;
      min-width: 0;
    }
    .op-info-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--gray-900);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .op-info-email {
      font-size: 11px;
      color: var(--gray-500);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .op-info-role {
      margin-top: 4px;
    }
    .auth-card.wider {
      max-width: 720px;
    }
    .back-link {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
    }
    .back-link a {
      color: var(--gray-500);
      text-decoration: none;
    }
    .back-link a:hover {
      color: var(--mint-600);
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card wider">
    <img src="assets/koala-happy.png" alt="" class="auth-koala" />
    <h1>担当者を選択</h1>
    <p class="auth-sub">この PC で作業する担当者をクリックしてください</p>

    <div id="opGrid" class="op-grid">
      <div class="muted" style="grid-column: 1/-1; text-align: center; padding: 20px;">読み込み中...</div>
    </div>

    <div id="errorMsg" class="auth-msg err" style="display:none;"></div>

    <div class="back-link">
      <a href="#" onclick="logout(); return false;">ログイン画面に戻る</a>
    </div>
  </div>
</div>

<script src="github-store.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('importcore.github.pat');
    if (!token) {
      window.location.href = 'login.html';
      return;
    }

    try {
      await GitHubStore.authenticate(token);
      const users = await GitHubStore.loadUserList();
      renderOperators(users);
    } catch (e) {
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'block';
      let msg = e.message || 'エラー';
      if (msg.includes('UNAUTHORIZED')) {
        msg = 'ログインキーが無効です。管理者に新しい初期設定リンクを依頼してください。';
      }
      errEl.innerHTML = msg;
      document.getElementById('opGrid').innerHTML = '';
    }
  });

  function renderOperators(users) {
    const grid = document.getElementById('opGrid');
    if (!users || users.length === 0) {
      grid.innerHTML = '<div class="muted" style="grid-column:1/-1;text-align:center;padding:20px;">担当者が登録されていません。管理者にご連絡ください。</div>';
      return;
    }

    const order = { super_admin: 0, admin: 1, member: 2 };
    users.sort((a, b) => {
      const ra = order[a.role] != null ? order[a.role] : 9;
      const rb = order[b.role] != null ? order[b.role] : 9;
      if (ra !== rb) return ra - rb;
      return (a.displayName || '').localeCompare(b.displayName || '');
    });

    grid.innerHTML = users.map(u => {
      const initial = (u.displayName || u.email || '?').charAt(0);
      let roleClass = 'role-user';
      let roleLabel = 'メンバー';
      if (u.role === 'super_admin') { roleClass = 'role-super'; roleLabel = '絶対管理者'; }
      else if (u.role === 'admin') { roleClass = 'role-admin'; roleLabel = '管理者'; }

      return `
        <div class="op-card" onclick="selectOperator('${escapeHtml(u.email)}')">
          <div class="op-avatar-big">${escapeHtml(initial)}</div>
          <div class="op-info">
            <div class="op-info-name">${escapeHtml(u.displayName || u.email)}</div>
            <div class="op-info-email">${escapeHtml(u.email)}</div>
            <div class="op-info-role"><span class="${roleClass}">${roleLabel}</span></div>
          </div>
        </div>
      `;
    }).join('');
  }

  async function selectOperator(email) {
    try {
      await GitHubStore.selectOperator(email);
      localStorage.setItem('importcore.operator.email', email);
      window.location.href = 'index.html';
    } catch (e) {
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'block';
      errEl.textContent = e.message || 'エラー';
    }
  }

  function logout() {
    localStorage.removeItem('importcore.operator.email');
    sessionStorage.setItem('importcore.force.login', '1');
    window.location.href = 'login.html';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }
</script>
</body>
</html>
