<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>担当者選択 - Import Core</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .op-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }
    .op-card {
      background: #fff;
      border: 2px solid var(--mint-100);
      border-radius: 16px;
      padding: 20px 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }
    .op-card:hover {
      border-color: var(--mint-400);
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(29, 144, 128, 0.15);
    }
    .op-koala-circle {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mint-50), #fff);
      border: 2px solid var(--mint-200);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .op-koala-circle img {
      width: 78px;
      height: 78px;
      object-fit: contain;
    }
    .op-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--gray-900);
      line-height: 1.3;
      word-break: break-word;
    }
    .op-email {
      font-size: 11px;
      color: var(--gray-500);
      word-break: break-all;
      line-height: 1.3;
    }
    .op-role-row {
      margin-top: 2px;
    }
    .auth-card.wider {
      max-width: 760px;
    }
    .back-link {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
    }
    .back-link a {
      color: var(--gray-500);
      text-decoration: none;
    }
    .back-link a:hover {
      color: var(--mint-600);
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card wider">
    <img src="assets/koala-wave.png" alt="" class="auth-koala" />
    <h1>担当者を選択</h1>
    <p class="auth-sub">この PC で作業する担当者をクリックしてください</p>

    <div id="opGrid" class="op-grid">
      <div class="muted" style="grid-column: 1/-1; text-align: center; padding: 20px;">読み込み中...</div>
    </div>

    <div id="errorMsg" class="auth-msg err" style="display:none;"></div>

    <div class="back-link">
      <a href="#" onclick="logout(); return false;">ログイン画面に戻る</a>
    </div>
  </div>
</div>

<script src="github-store.js"></script>
<script src="ui-helper.js"></script>
<script>
  // 5種類のコアラ画像
  const KOALA_IMAGES = [
    'assets/koala-happy.png',
    'assets/koala-pc.png',
    'assets/koala-think.png',
    'assets/koala-thumb.png',
    'assets/koala-wave.png'
  ];

  // 配列をシャッフル(Fisher-Yates)
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ユーザー数分のコアラ画像を返す(毎回シャッフル)
  function assignKoalas(count) {
    if (count <= KOALA_IMAGES.length) {
      // 5人以下:5枚をシャッフルして先頭から取る → 全員違うコアラ
      return shuffle(KOALA_IMAGES).slice(0, count);
    }
    // 6人以上:複数バッチに分けて、隣同士の重複を避けつつシャッフル
    const result = [];
    let pool = shuffle(KOALA_IMAGES);
    let poolIdx = 0;
    for (let i = 0; i < count; i++) {
      if (poolIdx >= KOALA_IMAGES.length) {
        pool = shuffle(KOALA_IMAGES);
        // 直前のと被らないように先頭を入れ替え
        if (pool[0] === result[result.length - 1] && pool.length > 1) {
          [pool[0], pool[1]] = [pool[1], pool[0]];
        }
        poolIdx = 0;
      }
      result.push(pool[poolIdx]);
      poolIdx++;
    }
    return result;
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('importcore.github.pat');
    if (!token) {
      window.location.href = 'login.html';
      return;
    }

    try {
      await GitHubStore.authenticate(token);
      const users = await GitHubStore.loadUserList();
      renderOperators(users);
    } catch (e) {
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'block';
      let msg = e.message || 'エラー';
      if (msg.includes('UNAUTHORIZED')) {
        msg = 'ログインキーが無効です。管理者に新しい初期設定リンクを依頼してください。';
      }
      errEl.innerHTML = msg;
      document.getElementById('opGrid').innerHTML = '';
    }
  });

  function renderOperators(users) {
    const grid = document.getElementById('opGrid');
    if (!users || users.length === 0) {
      grid.innerHTML = '<div class="muted" style="grid-column:1/-1;text-align:center;padding:20px;">担当者が登録されていません。管理者にご連絡ください。</div>';
      return;
    }

    // 並び順は固定:権限順 → 表示名順
    const order = { super_admin: 0, admin: 1, member: 2 };
    users.sort((a, b) => {
      const ra = order[a.role] != null ? order[a.role] : 9;
      const rb = order[b.role] != null ? order[b.role] : 9;
      if (ra !== rb) return ra - rb;
      return (a.displayName || '').localeCompare(b.displayName || '');
    });

    // コアラ画像を毎回シャッフルして割り当て
    const koalas = assignKoalas(users.length);

    grid.innerHTML = users.map((u, i) => {
      let roleClass = 'role-user';
      let roleLabel = 'メンバー';
      if (u.role === 'super_admin') { roleClass = 'role-super'; roleLabel = '絶対管理者'; }
      else if (u.role === 'admin') { roleClass = 'role-admin'; roleLabel = '管理者'; }

      return `
        <div class="op-card" onclick="selectOperator('${escapeHtml(u.email)}')">
          <div class="op-koala-circle">
            <img src="${koalas[i]}" alt="" />
          </div>
          <div class="op-name">${escapeHtml(u.displayName || u.email)}</div>
          <div class="op-email">${escapeHtml(u.email)}</div>
          <div class="op-role-row"><span class="${roleClass}">${roleLabel}</span></div>
        </div>
      `;
    }).join('');
  }

  async function selectOperator(email) {
    try {
      await GitHubStore.selectOperator(email);
      localStorage.setItem('importcore.operator.email', email);
      window.location.href = 'index.html';
    } catch (e) {
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'block';
      errEl.textContent = e.message || 'エラー';
    }
  }

  function logout() {
    localStorage.removeItem('importcore.operator.email');
    sessionStorage.setItem('importcore.force.login', '1');
    window.location.href = 'login.html';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }
</script>
</body>
</html>
