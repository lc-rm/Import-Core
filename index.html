<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>変換 - Import Core</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="brand">
    <img src="assets/koala-pc.png" alt="" />
    <span>Import Core</span>
  </div>
  <nav>
    <a href="index.html" class="active">変換</a>
    <a href="settings.html">クライアント・履歴</a>
    <a href="account.html">アカウント</a>
  </nav>
  <div class="user-badge">
    <span>👤 <span class="uid" id="currentUser"></span></span>
    <button id="logoutBtn" type="button">ログアウト</button>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-header-with-koala">
      <img src="assets/koala-wave.png" alt="" />
      <div>
        <h1>応募者情報を変換</h1>
        <div class="note">クライアントと媒体を選んで、応募情報のファイルをドラッグ&ドロップしてください。<br>過去5回分の取込履歴と照合し、<b>新規の候補者だけ</b>を変換します。</div>
      </div>
    </div>

    <div class="row">
      <label>クライアント
        <select id="client"></select>
      </label>
      <label>媒体
        <select id="source"></select>
      </label>
      <label>応募日(指定すると全件を上書き)
        <input id="applyDate" type="date" />
      </label>
    </div>

    <div id="drop">
      <img src="assets/koala-pc.png" alt="" class="koala-drop" />
      ここにファイルをドラッグ&ドロップ
      <span class="sub">またはクリックして選択 / Excel(.xls/.xlsx)・CSV対応</span>
    </div>
    <input id="file" type="file" hidden />

    <div class="row" style="margin-top:14px">
      <button id="download" disabled>新規分のCSVをダウンロード</button>
      <span id="msg" class="muted"></span>
    </div>

    <div id="summary"></div>
    <div id="preview" class="scroll"></div>
    <div id="dupList" class="scroll"></div>
  </div>

  <div class="card" id="historyCard">
    <h2>このクライアントの取込履歴(媒体ごとに直近5回)</h2>
    <div id="historyList" class="muted">クライアントと媒体を選ぶと表示されます</div>
  </div>
</main>

<script src="auth.js"></script>
<script src="sources.js"></script>
<script src="converter.js"></script>
<script>
const $ = id => document.getElementById(id);

// ログイン必須
if (!Auth.requireLogin()) throw new Error('login required');

let lastNewRecords = [];
let lastDuplicates = [];
let currentSource = null;

async function init(){
  $('currentUser').textContent = Auth.getCurrentUserId();
  $('logoutBtn').onclick = () => { Auth.clearSession(); location.href = 'login.html'; };

  populateSources();
  await populateClients();
  await refreshHistory();
  updateFileAccept();

  $('client').addEventListener('change', refreshHistory);
  $('source').addEventListener('change', () => {
    refreshHistory();
    updateFileAccept();
  });

  $('drop').onclick = () => $('file').click();
  $('file').onchange = e => handleFile(e.target.files[0]);
  ['dragenter','dragover'].forEach(ev =>
    $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('drag'); })
  );
  ['dragleave','drop'].forEach(ev =>
    $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('drag'); })
  );
  $('drop').addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
  $('download').onclick = downloadCsv;
}

function populateSources(){
  const sel = $('source');
  sel.innerHTML = '';
  for (const id in SOURCES){
    const s = SOURCES[id];
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = s.label + (s.placeholder ? ' (汎用)' : '');
    sel.appendChild(opt);
  }
}

function updateFileAccept(){
  const sId = $('source').value;
  currentSource = SOURCES[sId];
  $('file').accept = currentSource.fileTypes || '.xls,.xlsx,.csv';
}

async function populateClients(){
  const sel = $('client');
  sel.innerHTML = '';
  const clients = await SecureStore.loadClients();
  if (clients.length === 0){
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '-- 「クライアント・履歴」ページで追加してください --';
    sel.appendChild(opt);
    return;
  }
  for (const c of clients){
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    sel.appendChild(opt);
  }
}

async function refreshHistory(){
  const cId = $('client').value;
  const box = $('historyList');
  if (!cId){ box.textContent = 'クライアント未選択'; return; }
  const all = await SecureStore.getAllHistory();
  const byClient = (all && all[cId]) || {};
  // 全媒体の履歴を集めて時系列降順にソート
  const flat = [];
  for (const sId in byClient){
    for (const e of (byClient[sId] || [])){
      flat.push({ sId, ...e });
    }
  }
  flat.sort((a,b) => new Date(b.processedAt) - new Date(a.processedAt));
  if (flat.length === 0){
    box.innerHTML = '<span class="muted">履歴なし(初回取込時に作成されます)</span>';
    return;
  }
  const rows = flat.map((e,i) => {
    const dt = new Date(e.processedAt).toLocaleString('ja-JP');
    const sLabel = (SOURCES[e.sId] && SOURCES[e.sId].label) || e.sId;
    const total = e.totalCount ?? e.count ?? 0;
    const newC = e.newCount ?? e.count ?? 0;
    const dupC = e.dupCount ?? 0;
    const dlBtn = e.csv
      ? `<button class="small" onclick="redownloadHistory('${cId}','${e.sId}','${e.processedAt}')">📥CSV</button>`
      : `<span class="muted" style="font-size:11px">―</span>`;
    return `<tr>
      <td>${i+1}</td>
      <td><b>${escapeHtml(sLabel)}</b></td>
      <td>${dt}</td>
      <td>${total}件</td>
      <td class="ok">${newC}件</td>
      <td class="dup">${dupC}件</td>
      <td>${dlBtn}</td>
    </tr>`;
  }).join('');
  box.innerHTML = `
    <table>
      <thead><tr><th>#</th><th>媒体</th><th>取込日時</th><th>全体</th><th>新規</th><th>重複</th><th>CSV</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function redownloadHistory(clientId, sourceId, processedAt){
  const all = await SecureStore.getAllHistory();
  const arr = (all[clientId] && all[clientId][sourceId]) || [];
  const entry = arr.find(e => e.processedAt === processedAt);
  if (!entry || !entry.csv){
    alert('このCSVデータは保持されていません(直近1回分のみ再ダウンロード可能です)');
    return;
  }
  const blob = new Blob([entry.csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = entry.filename || 'export.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function handleFile(file){
  if (!file) return;
  const cId = $('client').value;
  if (!cId){ $('msg').innerHTML = '<span class="err">先にクライアントを選択してください</span>'; return; }

  const sId = $('source').value;
  const source = SOURCES[sId];

  $('msg').textContent = '読み込み中...';
  $('summary').innerHTML = '';
  $('preview').innerHTML = '';
  $('dupList').innerHTML = '';

  try {
    const rawRows = await readFile(file, source);
    if (rawRows.length === 0){
      $('msg').innerHTML = '<span class="err">データが見つかりませんでした(列ヘッダーがないファイルかもしれません)</span>';
      return;
    }

    const options = {
      applyDate: $('applyDate').value,
      mediaName: source.mediaName
    };
    const allRecords = convertRows(rawRows, source, options);

    const known = await SecureStore.getKnownKeys(cId, sId);
    const newRecords = [];
    const duplicates = [];
    for (const rec of allRecords){
      const keys = makeKeys(rec);
      const hit = keys.some(k => known.has(k));
      if (hit) duplicates.push({ rec, keys });
      else     newRecords.push({ rec, keys });
    }

    lastNewRecords = newRecords.map(x => x.rec);
    lastDuplicates = duplicates.map(x => x.rec);

    showSummary(allRecords.length, newRecords.length, duplicates.length, file.name);
    showPreview(lastNewRecords);
    showDupList(lastDuplicates);

    $('download').disabled = lastNewRecords.length === 0;
    $('msg').textContent = '';
  } catch (e){
    console.error(e);
    $('msg').innerHTML = `<span class="err">読み込みに失敗しました:${e.message}</span>`;
  }
}

function showSummary(total, newCount, dupCount, fileName){
  const koala = newCount > 0 ? 'koala-thumb.png' : 'koala-think.png';
  $('summary').innerHTML = `
    <div class="summary">
      <img src="assets/${koala}" alt="" class="koala-img" />
      <div class="stats">
        <div><span class="lbl">ファイル</span><span class="val" style="font-size:13px;font-weight:600">${fileName}</span></div>
        <div><span class="lbl">取込全体</span><span class="val">${total}件</span></div>
        <div><span class="lbl ok">新規</span><span class="val ok">${newCount}件</span></div>
        <div><span class="lbl dup">重複(除外)</span><span class="val dup">${dupCount}件</span></div>
      </div>
    </div>`;
}

function showPreview(records){
  if (records.length === 0){
    $('preview').innerHTML = `
      <div class="hero-empty">
        <img src="assets/koala-think.png" alt="" />
        <p>新規の候補者はありませんでした</p>
        <p class="muted">すべて過去5回分の履歴と重複しています</p>
      </div>`;
    return;
  }
  const cols = ['応募日','求人名称','名前','ふりがな','メール','電話','性別','メモ'];
  const head = '<tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
  const body = records.slice(0,10).map(r =>
    '<tr>' + cols.map(c => `<td>${escapeHtml(norm(r[c]))}</td>`).join('') + '</tr>'
  ).join('');
  $('preview').innerHTML = `
    <h3>新規分プレビュー(先頭10件)</h3>
    <table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function showDupList(records){
  if (records.length === 0){ $('dupList').innerHTML = ''; return; }
  const cols = ['名前','メール','電話'];
  const head = '<tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
  const body = records.slice(0,20).map(r =>
    '<tr>' + cols.map(c => `<td>${escapeHtml(norm(r[c]))}</td>`).join('') + '</tr>'
  ).join('');
  $('dupList').innerHTML = `
    <h3 class="dup">重複として除外された候補者(${records.length}件 / 先頭20件)</h3>
    <table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

async function downloadCsv(){
  if (lastNewRecords.length === 0) return;
  const cId = $('client').value;
  const sId = $('source').value;
  const clients = await SecureStore.loadClients();
  const client = clients.find(c => c.id === cId);
  const csv = makeCsv(lastNewRecords);

  const today = new Date().toISOString().slice(0,10);
  const safeName = (client?.name || 'client').replace(/[\\/:*?"<>|]/g,'_');
  const fname = `採用コア_${safeName}_${SOURCES[sId].label}_${today}.csv`;

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);

  const keys = [];
  for (const r of lastNewRecords){
    for (const k of makeKeys(r)) keys.push(k);
  }
  const totalCount = lastNewRecords.length + lastDuplicates.length;
  await SecureStore.appendHistory(cId, sId, keys, lastNewRecords.length, {
    totalCount,
    newCount: lastNewRecords.length,
    dupCount: lastDuplicates.length,
    csv,
    filename: fname
  });
  await refreshHistory();
  $('msg').innerHTML = `<span class="ok">${lastNewRecords.length}件をCSVに出力し、履歴に記録しました</span>`;
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.redownloadHistory = redownloadHistory;
init().catch(e => { console.error(e); $('msg').innerHTML = `<span class="err">${e.message}</span>`; });
</script>
</body>
</html>
