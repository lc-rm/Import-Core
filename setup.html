<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>初期設定 - Import Core</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <img src="assets/koala-wave.png" alt="" class="auth-koala" />
    <h1 id="title">初期設定中...</h1>
    <p class="auth-sub" id="subtitle">少々お待ちください</p>

    <div id="status" class="auth-msg muted">セットアップを実行中...</div>

    <div id="userInfo" style="display:none; background: var(--mint-50); border: 1px solid var(--mint-100); border-radius: 10px; padding: 14px 16px; margin: 16px 0; font-size: 13px;">
      <div style="margin-bottom: 6px;"><strong style="color: var(--mint-700);">あなた:</strong> <span id="userName">—</span></div>
      <div><strong style="color: var(--mint-700);">メール:</strong> <span id="userEmail">—</span></div>
    </div>

    <button id="continueBtn" class="submit" onclick="goLogin()" style="display:none;">ログイン画面へ</button>
    <button id="retryBtn" class="submit" onclick="location.reload()" style="display:none;">再試行</button>
    <div style="text-align: center; margin-top: 14px;">
      <a href="login.html" id="manualLink" class="muted" style="display:none; font-size: 12px;">手動でログイン画面に進む</a>
    </div>
  </div>
</div>

<script src="github-store.js"></script>
<script>
  function showStatus(type, msg) {
    const el = document.getElementById('status');
    el.className = 'auth-msg ' + type;
    el.innerHTML = msg;
  }

  function setTitle(title, subtitle) {
    document.getElementById('title').textContent = title;
    document.getElementById('subtitle').textContent = subtitle;
  }

  function goLogin() {
    window.location.href = 'login.html';
  }

  function parseHash() {
    const hash = window.location.hash.replace(/^#/, '');
    const params = {};
    hash.split('&').forEach(pair => {
      const [k, v] = pair.split('=');
      if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });
    return params;
  }

  async function runSetup() {
    const params = parseHash();
    const token = params.token;
    const email = params.email;

    if (!token || !email) {
      setTitle('セットアップ情報が不足', 'リンクが正しく開けませんでした');
      showStatus('err',
        'セットアップに必要な情報がリンクに含まれていません。<br>' +
        '管理者から送られてきた完全なリンクをクリックしてください。'
      );
      document.getElementById('manualLink').style.display = 'inline';
      return;
    }

    try {
      localStorage.setItem('importcore.github.pat', token);

      await GitHubStore.authenticate(token);
      const users = await GitHubStore.loadUserList();
      const user = users.find(u =>
        (u.email || '').toLowerCase() === email.toLowerCase()
      );

      if (!user) {
        GitHubStore.logout();
        setTitle('登録外のユーザー', '管理者にご連絡ください');
        showStatus('err',
          `${email} は担当者リストに登録されていません。<br>` +
          '管理者に「Import Core に登録してください」とご連絡ください。'
        );
        return;
      }

      await GitHubStore.selectOperator(email);
      localStorage.setItem('importcore.operator.email', email);

      setTitle('初期設定が完了しました!', 'ようこそ Import Core へ');
      showStatus('ok', 'セットアップ成功!');

      document.getElementById('userName').textContent = user.displayName;
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('userInfo').style.display = 'block';
      document.getElementById('continueBtn').style.display = 'block';

    } catch (e) {
      console.error('Setup error:', e);
      localStorage.removeItem('importcore.github.pat');
      localStorage.removeItem('importcore.operator.email');

      setTitle('セットアップに失敗', 'もう一度お試しください');

      let msg = e.message || '不明なエラー';
      if (msg.includes('UNAUTHORIZED')) {
        msg = 'リンクのキーが無効です。管理者に新しいリンクを発行してもらってください。';
      } else if (msg.includes('FORBIDDEN')) {
        msg = 'リンクのキーに権限がありません。管理者にご確認ください。';
      } else if (msg.includes('NOT_FOUND')) {
        msg = 'データが見つかりません。管理者にご確認ください。';
      } else if (/NetworkError|Failed to fetch/.test(msg)) {
        msg = 'ネットワークエラー。インターネット接続を確認してください。';
      }
      showStatus('err', msg);
      document.getElementById('retryBtn').style.display = 'block';
      document.getElementById('manualLink').style.display = 'inline';
    }
  }

  window.addEventListener('DOMContentLoaded', runSetup);
</script>
</body>
</html>
