<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import Core - 初期設定</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #fef3e2 0%, #f6e9d0 50%, #f0dfb8 100%);
    color: #4a3520;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 36px 32px 28px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 8px 32px rgba(150, 100, 40, 0.15);
    border: 1px solid #e8d4b3;
    text-align: center;
  }
  .koala {
    font-size: 60px;
    margin-bottom: 14px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    color: #6b4a20;
  }
  .subtitle {
    margin: 0 0 24px;
    font-size: 13px;
    color: #8a7560;
    line-height: 1.6;
  }
  .status {
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .status.success {
    background: #e7f5ea;
    color: #2d6b3f;
    border: 1px solid #b9dec3;
  }
  .status.error {
    background: #fce8e8;
    color: #8a2a2a;
    border: 1px solid #f1b9b9;
  }
  .status.info {
    background: #eef3fa;
    color: #355484;
    border: 1px solid #c0d2ec;
  }
  .info-line {
    background: #fdf6e8;
    border: 1px solid #e0c89e;
    border-radius: 8px;
    padding: 10px 14px;
    margin: 12px 0;
    font-size: 13px;
    color: #6b4a20;
    text-align: left;
  }
  .info-line strong {
    color: #8a6332;
    margin-right: 8px;
  }
  button.primary {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #d4a05a, #c98b3f);
    color: #fff;
    border: 0;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 3px 10px rgba(201, 139, 63, 0.3);
  }
  button.primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(201, 139, 63, 0.4);
  }
  button.primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .small-link {
    display: block;
    margin-top: 14px;
    color: #8a7560;
    font-size: 12px;
    text-decoration: underline;
  }
  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2.5px solid #e0c89e;
    border-top-color: #c98b3f;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="koala">🐨</div>
  <h1 id="title">初期設定中...</h1>
  <p class="subtitle" id="subtitle">少々お待ちください</p>

  <div id="status" class="status info">
    <span class="spinner"></span>セットアップを実行中...
  </div>

  <div id="userInfo" style="display:none;">
    <div class="info-line">
      <strong>あなた:</strong>
      <span id="userName">—</span>
    </div>
    <div class="info-line">
      <strong>メール:</strong>
      <span id="userEmail">—</span>
    </div>
  </div>

  <button class="primary" id="continueBtn" onclick="goLogin()" style="display:none;">ログイン画面へ</button>
  <button class="primary" id="retryBtn" onclick="location.reload()" style="display:none;">再試行</button>
  <a href="login.html" class="small-link" id="manualLink" style="display:none;">手動でログイン画面に進む</a>
</div>

<script src="github-store.js"></script>
<script>
  function showStatus(type, msg) {
    const el = document.getElementById('status');
    el.className = 'status ' + type;
    el.innerHTML = msg;
  }

  function setTitle(title, subtitle) {
    document.getElementById('title').textContent = title;
    document.getElementById('subtitle').textContent = subtitle;
  }

  function goLogin() {
    window.location.href = 'login.html';
  }

  function parseHash() {
    const hash = window.location.hash.replace(/^#/, '');
    const params = {};
    hash.split('&').forEach(pair => {
      const [k, v] = pair.split('=');
      if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });
    return params;
  }

  async function runSetup() {
    const params = parseHash();
    const token = params.token;
    const email = params.email;

    if (!token || !email) {
      setTitle('セットアップ情報が不足', 'リンクが正しく開けませんでした');
      showStatus('error',
        '❌ セットアップに必要な情報がリンクに含まれていません。<br>' +
        '管理者から送られてきた完全なリンクをクリックしてください。'
      );
      document.getElementById('manualLink').style.display = 'block';
      return;
    }

    // 一時的にトークン保存して認証を試みる
    try {
      localStorage.setItem('importcore.github.pat', token);

      // GitHub に認証して users.json と照合
      await GitHubStore.authenticate(token);
      const users = await GitHubStore.loadUserList();
      const user = users.find(u =>
        (u.email || '').toLowerCase() === email.toLowerCase()
      );

      if (!user) {
        // 認証は通ったが users.json に該当ユーザーがいない
        GitHubStore.logout();
        setTitle('登録外のユーザー', '管理者にご連絡ください');
        showStatus('error',
          `❌ ${email} は担当者リストに登録されていません。<br>` +
          '管理者に「Import Core に登録してください」とご連絡ください。'
        );
        return;
      }

      // 担当者として登録
      await GitHubStore.selectOperator(email);

      // メアドも保存(2回目以降の判別用)
      localStorage.setItem('importcore.operator.email', email);

      // 成功
      setTitle('初期設定が完了しました!', 'ようこそ Import Core へ');
      showStatus('success', '✅ セットアップ成功!');

      document.getElementById('userName').textContent = user.displayName;
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('userInfo').style.display = 'block';
      document.getElementById('continueBtn').style.display = 'block';

    } catch (e) {
      console.error('Setup error:', e);
      // 失敗時はトークン削除
      localStorage.removeItem('importcore.github.pat');
      localStorage.removeItem('importcore.operator.email');

      setTitle('セットアップに失敗', 'もう一度お試しください');

      let msg = e.message || '不明なエラー';
      if (msg.includes('UNAUTHORIZED')) {
        msg = 'リンクのキーが無効です。管理者に新しいリンクを発行してもらってください。';
      } else if (msg.includes('FORBIDDEN')) {
        msg = 'リンクのキーに権限がありません。管理者にご確認ください。';
      } else if (msg.includes('NOT_FOUND')) {
        msg = 'データが見つかりません。管理者にご確認ください。';
      } else if (/NetworkError|Failed to fetch/.test(msg)) {
        msg = 'ネットワークエラー。インターネット接続を確認してください。';
      }
      showStatus('error', `❌ ${msg}`);
      document.getElementById('retryBtn').style.display = 'block';
      document.getElementById('manualLink').style.display = 'block';
    }
  }

  window.addEventListener('DOMContentLoaded', runSetup);
</script>
</body>
</html>
