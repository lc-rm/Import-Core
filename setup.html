<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>初回セットアップ - Import Core</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <img src="assets/koala-wave.png" alt="" class="auth-koala" />
    <h1>Import Core へようこそ</h1>
    <p class="auth-sub">最初の管理ユーザーを作成してください</p>

    <form id="setupForm">
      <div class="form-row">
        <label for="userId">ユーザーID</label>
        <input type="text" id="userId" autocomplete="username" required minlength="3" placeholder="メールアドレス または 任意のID(3文字以上)" />
      </div>
      <div class="form-row">
        <label for="password">パスワード</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="6" placeholder="6文字以上" />
      </div>
      <div class="form-row">
        <label for="password2">パスワード(確認)</label>
        <input type="password" id="password2" autocomplete="new-password" required minlength="6" placeholder="もう一度入力" />
      </div>
      <button type="submit" class="submit">アカウントを作成</button>
    </form>
    <div id="msg" class="auth-msg muted"></div>

    <p class="muted" style="margin-top:24px; font-size:12px; line-height:1.6">
      ⚠️ パスワードは暗号化キーとして使用されます。<br>
      <b>忘れると保存データが復号できなくなります</b>のでご注意ください。
    </p>
  </div>
</div>

<script src="auth.js"></script>
<script>
const $ = id => document.getElementById(id);

// 既にユーザーがいる場合はログイン画面へ
if (Auth.loadUsers().length > 0){
  location.href = 'login.html';
}

$('setupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const userId = $('userId').value.trim();
  const pw = $('password').value;
  const pw2 = $('password2').value;
  const msg = $('msg');

  // 半角英数字、アンダースコア、ハイフン、ドット、@(メールアドレス対応)を許可、3文字以上
  if (!/^[A-Za-z0-9_.@\-]{3,}$/.test(userId)){
    msg.innerHTML = '<span class="err">IDは半角英数字、_ - . @ のみ、3文字以上で入力してください</span>';
    return;
  }
  if (pw !== pw2){
    msg.innerHTML = '<span class="err">パスワード(確認)が一致しません</span>';
    return;
  }
  if (pw.length < 6){
    msg.innerHTML = '<span class="err">パスワードは6文字以上にしてください</span>';
    return;
  }

  try {
    msg.textContent = '作成中...';
    await Auth.addUser(userId, pw, 'admin');
    Auth.setSession(userId, pw);
    msg.innerHTML = '<span class="ok">作成完了!画面を移動します...</span>';
    setTimeout(() => location.href = 'index.html', 600);
  } catch(err){
    msg.innerHTML = `<span class="err">${err.message}</span>`;
  }
});
</script>
</body>
</html>
